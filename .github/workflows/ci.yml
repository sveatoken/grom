name: CI

# Every push and pull request must prove the same five gates the project
# documents: JVM tests, policy, third-party ledger, IPC signing, and lint.
# The APKs are built first because verify-ipc-signing inspects real artifacts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Gradle memory settings come from the committed gradle.properties so that the
# laptop and CI builds share one profile.

jobs:
  android:
    name: Android build, tests, gates and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # The actions/setup-android action (v3) runs `sdkmanager tools`, but
        # Google removed the legacy "tools" package from the repository, so the
        # action now fails before any Grom step runs. ubuntu-latest already
        # ships a complete SDK; install only the two pinned packages on top.
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          sdkmanager_bin="$(find "$sdk/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_BUILD_TOOLS=$sdk/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build both role flavours and the C-008 test apps
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleServer29Debug \
            :app:assemblePeripheral26Debug \
            :testapps:samecert:assembleDebug \
            :testapps:foreigncert:assembleDebug

      - name: JVM tests (engine, sdk, both examples and both flavours)
        run: |
          gradle --no-daemon --stacktrace \
            :engine:testDebugUnitTest \
            :sdk:testDebugUnitTest \
            :examples:connect:testDebugUnitTest \
            :examples:embedded:testDebugUnitTest \
            :app:testServer29DebugUnitTest \
            :app:testPeripheral26DebugUnitTest
          # Gradle says "BUILD SUCCESSFUL" whether it ran 838 tests or five.
          # This checks that every test class on disk produced a result, so a
          # narrowed task cannot pass as a full suite (D108).
          ./tools/check-test-reports

      - name: Policy gates (third-party ledger, static policy, IPC signing)
        run: |
          tools/check-third-party
          tools/test-policy
          tools/verify-ipc-signing
          tools/check-flavours

      # The shipping guide, executed: a host rooted outside this repository
      # builds an APK from the documented build file (D112). It is a separate
      # step so a failure names the integration, not the server.
      - name: Embedded host from an unrelated root
        run: ./tools/check-embed

      - name: Fleet view self-test
        run: ./tools/test-fleet

      - name: Hub roster self-test
        run: ./tools/test-hub

      - name: Provisioning self-test
        run: ./tools/test-provision

      - name: Lint (both flavours)
        run: |
          gradle --no-daemon --stacktrace \
            :app:lintServer29Debug \
            :app:lintPeripheral26Debug

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            engine/build/reports/tests/
            sdk/build/reports/tests/
            examples/connect/build/reports/tests/
            examples/embedded/build/reports/tests/
            app/build/reports/lint-results-*.html
            engine/build/reports/lint-results-*.html
          if-no-files-found: warn

      - name: Runtime readiness (informational)
        run: scripts/build-node-android.sh --status

      - name: Publish APKs
        uses: actions/upload-artifact@v4
        with:
          name: grom-apks
          path: |
            app/build/outputs/apk/server29/debug/*.apk
            app/build/outputs/apk/peripheral26/debug/*.apk
            testapps/*/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  agent-runtime:
    name: Agent runtime (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the pinned runtime; 24 is the current LTS with node:sqlite
        # enabled by default. The agent must behave correctly on both.
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Agent protocol tests and static gate
        run: ./tools/test-agent-runtime

  site:
    name: Download page (static, no third parties)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The page is plain HTML/CSS/JS; the gate is the same one a laptop runs,
      # so a PR that breaks the stable APK links or adds a tracker fails here.
      - name: Static site gate
        run: ./tools/check-site
